name: Update JAL LSP data

on:
  workflow_dispatch:
  schedule:
    # 毎日 06:17 JST（UTCでは前日21:17）
    - cron: "17 21 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and build
        run: python scraper.py

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jal-search-html
          path: data/debug/
          retention-days: 7

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.csv docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update JAL LSP data"
            git push
          fi
